# Docker's embedded DNS updates these upstreams after container recreation.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream speedtest_backend {
    zone speedtest_backend 256k;
    server speedtest:80 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name example.com www.example.com pma.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;

    # Also reject an unknown Host sent after a handshake for a known SNI.
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;
    server_name example.com www.example.com;

    ssl_certificate /etc/letsencrypt/live/all/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/all/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;

    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=15768000" always;

    location / {
        root /var/www/simple_website;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;
    server_name speed.example.com;

    ssl_certificate /etc/letsencrypt/live/all/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/all/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=15768000" always;

    location / {
        proxy_pass          http://speedtest_backend/;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
    }
}
